experiment:
  id: e0-smoke-example
  seed: 42

dataset:
  name: hotpot_qa
  revision: TO_PIN
  split: validation
  max_examples: 32

retriever:
  type: gold_context
  top_k: 2

reader:
  family: baseline
  model: TO_SELECT
  revision: TO_PIN
  max_context_tokens: TO_SET
  max_output_tokens: TO_SET

evaluation:
  metrics: [exact_match, token_f1, retrieval_recall_at_k]
  distractor_counts: [0]

runtime:
  device: TO_SET
  output_dir: results/runs/e0-smoke-example

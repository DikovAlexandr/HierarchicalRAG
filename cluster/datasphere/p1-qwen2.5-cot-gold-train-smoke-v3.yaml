name: hierarchical-rag-p1-qwen25-cot-gold-train-smoke-v3
desc: Qwen CoT train-only v3 with the shared 3968+128 reader token budget.
cmd: >
  python -m pip install --disable-pip-version-check --no-cache-dir --no-deps
  --root-user-action=ignore --progress-bar off -r environments/hrm-text-gpu.lock
  && PYTHONPATH=src python -m hierarchical_rag.run_qwen_baseline_smoke
  --config experiments/configs/p1-qwen2.5-cot-gold-train-smoke-v3.yaml
inputs:
  - environments/hrm-text-gpu.lock
  - experiments/configs/p1-qwen2.5-cot-gold-train-smoke-v3.yaml
  - data/processed/hotpotqa/train-distractor-s42-n18.json
  - data/processed/hotpotqa/train-distractor-s42-n18.manifest.json
  - src/hierarchical_rag/__init__.py
  - src/hierarchical_rag/experiment.py
  - src/hierarchical_rag/hotpotqa.py
  - src/hierarchical_rag/metrics.py
  - src/hierarchical_rag/qwen_baseline.py
  - src/hierarchical_rag/run_qwen_baseline_smoke.py
outputs:
  - results/runs/p1-qwen2.5-cot-gold-train-smoke-v3/manifest.json
  - results/runs/p1-qwen2.5-cot-gold-train-smoke-v3/resolved-config.yaml
  - results/runs/p1-qwen2.5-cot-gold-train-smoke-v3/command.txt
  - results/runs/p1-qwen2.5-cot-gold-train-smoke-v3/environment.txt
  - results/runs/p1-qwen2.5-cot-gold-train-smoke-v3/predictions.jsonl
  - results/runs/p1-qwen2.5-cot-gold-train-smoke-v3/retrieval.jsonl
  - results/runs/p1-qwen2.5-cot-gold-train-smoke-v3/metrics.json
  - results/runs/p1-qwen2.5-cot-gold-train-smoke-v3/statistics.json
  - results/runs/p1-qwen2.5-cot-gold-train-smoke-v3/run.log
env:
  vars:
    - HIERARCHICAL_RAG_SOURCE_REVISION
    - PYTHONHASHSEED: 0
    - TOKENIZERS_PARALLELISM: "false"
    - HF_HUB_DISABLE_TELEMETRY: 1
  docker:
    image: pytorch/pytorch:2.5.1-cuda12.1-cudnn9-runtime@sha256:831247999fbf7e08f61b3e39f6d77ee434f38f6f07f769d00db451e853878067
cloud-instance-types:
  - g2.1
working-storage:
  type: SSD
  size: 100Gb
graceful-shutdown:
  signal: SIGTERM
  timeout: 30s
